# Apartment hunt settings. See README.md for setup of each source.

[search]
bedrooms = 1
bathrooms = 1
max_rent = 1700            # rent only; utilities are extra
stretch = 100              # up to $1,800 allowed, losing up to 10 points the further over $1,700
min_rent = 1000            # a DC 1BR below this is almost always a scam

[move_in]
date = "2027-01-31"
earliest_ok_days = 21      # a lease starting up to 3 weeks early still counts as a match
latest_ok_days = 10

# --- Sources -----------------------------------------------------------------

[sources.craigslist]
enabled = true
site = "washingtondc"
subarea = "doc"            # DC proper only (no NoVA / MD)
fetch_details = true       # open each new listing for its description, map pin and amenities
max_detail_fetches = 40
request_delay_seconds = 2.0
extra_params = {}          # e.g. { laundry = "1" } to require w/d in unit server-side

[sources.email_alerts]     # Zillow / Apartments.com / HotPads / Redfin / Trulia alert emails
enabled = true             # needs IMAP_USER / IMAP_PASSWORD set (README); skipped otherwise
imap_host = "imap.gmail.com"
folder = "Apartments"      # the Gmail label your alert filter applies
days = 3                   # how far back to read on each run
senders = ["zillow.com", "apartments.com", "hotpads.com", "redfin.com", "trulia.com", "zumper.com"]

[sources.rentcast]         # https://www.rentcast.io/api - aggregates MLS and rental sites
enabled = false            # set true after setting RENTCAST_API_KEY (README)
max_days_old = 14
min_hours_between_runs = 20  # free plan = 50 calls/month

# --- Location ------------------------------------------------------------------

[location]
allow_unknown = true       # keep listings whose neighborhood can't be determined (flagged)
neighborhood_match_km = 1.0
# Bonus points for areas you like best.
favorites = { "Adams Morgan" = 5, "Kalorama" = 3, "Dupont Circle" = 3, "Columbia Heights" = 3, "Mount Pleasant" = 3, "U Street" = 3 }
# Move neighborhoods between tiers: prime / good / caution / excluded
tier_overrides = {}

# --- Preferences --------------------------------------------------------------

[preferences]
# Rejected if the listing says it doesn't have them (e.g. "shared laundry", "window units");
# penalized and flagged "confirm" if it just doesn't mention them.
must_have = ["in_unit_laundry", "central_air"]
must_have_missing_penalty = 12
ground_floor_penalty = 12  # street-level windows = people looking in

[preferences.size]         # sq ft; you work from home and need room for a desk
min = 475
good = 600
great = 750

[preferences.weights]      # extra points when a listing mentions the amenity
workspace = 5              # den, office nook, flex room
dishwasher = 3
outdoor_space = 3
hardwood = 1
gym = 0
doorman = 0
parking = 0
pets_allowed = 0

[output]
dir = "reports"
min_score = 55             # listings below this are still in the CSV, but not the summary/email

[email]
to = ""                    # where to send the report; credentials come from env vars (README)
